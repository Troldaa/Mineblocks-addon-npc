plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.5"
    id 'net.minecrell.plugin-yml.bukkit' version '0.5.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

group 'cz.miniomega.mobs'
version '1.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = "https://repo.papermc.io/repository/maven-public/" }
    maven { url = "https://repo.codemc.io/repository/maven-public/" }
    maven { url = "https://repo.essentialsx.net/releases/" }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://oss.sonatype.org/content/repositories/central' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = "https://repo.aikar.co/content/groups/aikar/" }
    maven { url = "https://repo.minebench.de/" }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.8-R0.1-SNAPSHOT'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.8.3'
    compileOnly 'me.clip:placeholderapi:2.11.1'

    implementation 'net.kyori:adventure-platform-bukkit:4.2.0'
    implementation "co.aikar:acf-bukkit:0.5.1-SNAPSHOT"
    implementation 'de.themoep:minedown-adventure:1.7.1-SNAPSHOT'
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveFileName = "MineMobs-${project.version}.jar"
    relocate 'co.aikar.commands', 'cz.miniomega.mobs.libs.acf'
    relocate 'co.aikar.locales', 'cz.miniomega.mobs.libs.acf.locales'
    relocate 'de.themoep.minedown', 'cz.miniomega.mobs.libs.minedown'
    relocate 'net.kyori.adventure', 'cz.miniomega.mobs.libs.adventure'
    relocate 'net.kyori.examination', 'cz.miniomega.mobs.libs.adventure.examination'
    relocate 'org.intellij', 'cz.miniomega.mobs.libs.annotations.intellij'
    relocate 'org.jetbrains', 'cz.miniomega.mobs.libs.annotations.jetbrains'
}

bukkit {
    name = "MineMobs"
    description = "Standalone plugin that allows you to create \"Mine mobs\" on your server"
    version = project.version
    main = "cz.miniomega.mobs.MineMobsPlugin"
    author = "MiniOmega"
    website = "miniomega.cz"
    apiVersion = "1.16"
    load = "POSTWORLD"
    softDepend = [
        "DecentHolograms",
        "PlaceholderAPI"
    ]
}
